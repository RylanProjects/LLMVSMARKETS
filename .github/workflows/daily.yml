name: daily-forecasts

on:
  schedule:
    - cron: "17 15 * * *"   
  workflow_dispatch:         

permissions:
  contents: write            

concurrency:
  group: daily-forecasts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONUNBUFFERED: "1" 
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Resolve settled questions
        run: python resolve.py

      - name: Collect new questions
        run: python collect_markets.py

      - name: Get LLM forecasts
        timeout-minutes: 50    
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python forecast.py

      - name: Score so far
        if: always()
        run: python analyze.py

      - name: Commit data
        if: always()           
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data plots
          git diff --cached --quiet && exit 0
          git commit -m "Daily data $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
